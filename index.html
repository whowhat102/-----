<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171411">
  <title>大秦：天下初定</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e9e0ca;
      --muted: #9c9483;
      --dim: #625c50;
      --paper: #d7c6a1;
      --vermilion: #bd4932;
      --gold: #c59c5b;
      --jade: #83a38d;
      --line: rgba(215, 198, 161, .17);
      --serif: "Noto Serif SC", "Songti SC", serif;
      --display: "Ma Shan Zheng", "KaiTi", serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: #171411;
      font-family: var(--serif);
      background-image: radial-gradient(ellipse at 74% 9%, rgba(122, 64, 34, .18), transparent 38%),
        linear-gradient(90deg, transparent 49.9%, rgba(215, 198, 161, .025) 50%, transparent 50.1%);
    }
    button { font: inherit; }
    .frame { width: min(1320px, 100%); margin: 0 auto; padding: 0 42px 44px; }
    .topbar { height: 66px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--paper); letter-spacing: .16em; font-size: 12px; }
    .brand-mark { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--vermilion); color: var(--vermilion); font-family: var(--display); font-size: 17px; }
    .top-actions { display: flex; gap: 20px; align-items: center; }
    .save-state { color: var(--muted); font-size: 11px; }
    .text-button { color: var(--muted); background: transparent; border: 0; cursor: pointer; font-size: 12px; padding: 8px 0; }
    .text-button:hover { color: var(--ink); }
    .masthead { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 44px; padding: 42px 0 25px; align-items: end; }
    .eyebrow { color: var(--gold); font-size: 11px; letter-spacing: .25em; }
    h1 { margin: 12px 0 8px; font-family: var(--display); font-size: clamp(42px, 6vw, 72px); font-weight: 400; line-height: 1; letter-spacing: .06em; }
    .subtitle { color: var(--muted); font-size: 13px; letter-spacing: .08em; }
    .year-block { text-align: right; border-left: 1px solid var(--line); padding-left: 23px; }
    .year-label { color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .year { color: var(--paper); font-family: var(--display); font-size: 35px; margin-top: 2px; }
    .year span { font-size: 14px; color: var(--muted); font-family: var(--serif); }
    .progress-track { height: 2px; background: rgba(215,198,161,.12); margin: 0 0 29px; }
    .progress-fill { width: 0; height: 100%; background: var(--vermilion); transition: width .4s ease; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 286px; gap: 52px; align-items: start; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 13px; margin-bottom: 20px; }
    .section-heading h2 { font-size: 15px; font-weight: 500; margin: 0; letter-spacing: .08em; }
    .section-heading span { font-size: 11px; color: var(--muted); }
    .event-kicker { color: var(--vermilion); letter-spacing: .22em; font-size: 11px; margin: 27px 0 10px; }
    .event-title { font-family: var(--display); font-size: clamp(27px, 3.2vw, 38px); font-weight: 400; margin: 0 0 12px; }
    .event-copy { color: #bdb39e; font-size: 14px; line-height: 2; max-width: 700px; margin: 0; }
    .record { margin-top: 20px; padding: 11px 14px; border-left: 2px solid rgba(197,156,91,.56); background: rgba(197,156,91,.055); color: #a99f8b; font-size: 11px; line-height: 1.8; }
    .record strong { color: var(--gold); font-weight: 500; }
    .choices { margin-top: 25px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .choice {
      position: relative; text-align: left; min-height: 136px; padding: 16px 15px 14px; color: var(--ink);
      background: linear-gradient(145deg, rgba(215,198,161,.065), rgba(215,198,161,.018));
      border: 1px solid var(--line); cursor: pointer; transition: border-color .2s, background .2s, transform .2s;
    }
    .choice:hover { border-color: rgba(197,156,91,.65); background: rgba(197,156,91,.08); transform: translateY(-2px); }
    .choice:disabled { cursor: default; opacity: .58; transform: none; }
    .choice-no { color: var(--vermilion); font-family: var(--display); font-size: 19px; }
    .choice-title { display: block; font-size: 14px; margin: 6px 0; }
    .choice-desc { color: var(--muted); font-size: 11px; line-height: 1.7; display: block; }
    .side { border-left: 1px solid var(--line); padding-left: 23px; }
    .stats-grid { display: grid; grid-template-columns: 1fr; }
    .side .section-heading { margin-bottom: 14px; }
    .stat { margin: 0 0 17px; }
    .stat-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
    .stat-name { font-size: 12px; color: #c9c0ad; }
    .stat-value { color: var(--paper); font-size: 13px; font-variant-numeric: tabular-nums; }
    .stat-track { height: 3px; background: rgba(215,198,161,.12); }
    .stat-fill { height: 100%; width: 0; transition: width .35s ease; background: var(--gold); }
    .stat:nth-of-type(3) .stat-fill { background: var(--jade); }
    .stat:nth-of-type(4) .stat-fill { background: var(--vermilion); }
    .log { margin-top: 30px; }
    .log-list { list-style: none; margin: 0; padding: 0; }
    .log-item { display: grid; grid-template-columns: 39px 1fr; gap: 8px; border-bottom: 1px solid rgba(215,198,161,.09); padding: 9px 0; font-size: 11px; line-height: 1.7; color: var(--muted); }
    .log-year { color: var(--gold); }
    .empty-log { color: var(--dim); font-size: 11px; line-height: 1.8; }
    .trend-panel { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 22px; }
    .trend-panel .section-heading { margin-bottom: 10px; }
    .trend-note { color: var(--muted); font-size: 11px; line-height: 1.8; margin: 0 0 18px; }
    .trend-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 24px; }
    .trend-item { min-width: 0; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px 12px; padding: 12px 0; border-top: 1px solid rgba(215,198,161,.1); }
    .trend-name { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .trend-name strong { font-size: 12px; font-weight: 500; white-space: nowrap; }
    .trend-name span { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trend-score { color: var(--paper); font-size: 12px; font-variant-numeric: tabular-nums; }
    .trend-change { margin-left: 5px; font-size: 10px; }
    .trend-change.up { color: var(--jade); }
    .trend-change.down { color: var(--vermilion); }
    .trend-change.flat { color: var(--muted); }
    .trend-spark { grid-column: 1 / -1; display: block; width: 100%; height: 28px; overflow: visible; }
    .trend-spark polyline { fill: none; stroke-width: 1.7; vector-effect: non-scaling-stroke; }
    .footer { margin-top: 36px; border-top: 1px solid var(--line); padding-top: 14px; display: flex; justify-content: space-between; color: var(--dim); font-size: 10px; }
    .ending { display: none; border-top: 1px solid var(--line); margin-top: 27px; padding-top: 20px; }
    .ending h3 { margin: 0 0 8px; font-family: var(--display); font-size: 29px; font-weight: 400; }
    .ending p { color: var(--muted); font-size: 13px; line-height: 1.9; margin: 0 0 14px; }
    .restart { padding: 9px 15px; background: var(--vermilion); color: #fff1dc; border: 0; cursor: pointer; font-size: 12px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 10px); opacity: 0; pointer-events: none; padding: 10px 15px; background: #2a251e; border: 1px solid var(--line); color: var(--paper); font-size: 12px; transition: .2s; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media (max-width: 800px) {
      .frame { padding: 0 22px 30px; }
      .masthead { grid-template-columns: 1fr auto; gap: 14px; padding-top: 34px; }
      .layout { grid-template-columns: 1fr; gap: 32px; }
      .side { border-left: 0; border-top: 1px solid var(--line); padding: 22px 0 0; }
      .stats-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 22px; }
      .log { margin-top: 22px; }
      .trend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
    }
    @media (max-width: 520px) {
      .frame { padding: 0 17px 25px; }
      .brand { letter-spacing: .08em; }
      .top-actions { gap: 12px; }
      .save-state { display: none; }
      .masthead { padding-top: 28px; }
      h1 { font-size: 46px; }
      .year-block { padding-left: 12px; }
      .year { font-size: 29px; }
      .choices { grid-template-columns: 1fr; gap: 8px; }
      .choice { min-height: 0; padding: 12px 14px; }
      .choice-title { display: inline; margin: 0 8px 0 4px; }
      .choice-desc { margin: 4px 0 0 28px; }
      .trend-grid { gap: 0 14px; }
      .trend-name { gap: 5px; }
      .trend-name span { font-size: 9px; }
      .footer { gap: 14px; line-height: 1.6; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">秦</span><span>大秦 · 天下初定</span></div>
      <div class="top-actions"><span class="save-state" id="saveState">本地存档已启用</span><button class="text-button" id="resetButton" type="button" title="重新开始">重开此局</button></div>
    </header>
    <section class="masthead" aria-labelledby="gameTitle">
      <div><div class="eyebrow">始皇帝纪 · 第一卷</div><h1 id="gameTitle">天下初定</h1><div class="subtitle">六王既灭，四海归一。帝国将走向何处？</div></div>
      <div class="year-block"><div class="year-label">纪年 · 回合 <span id="turnLabel">01 / 12</span></div><div class="year"><span id="yearNumber">前221</span> <span>年</span></div></div>
    </section>
    <div class="progress-track" aria-label="游戏进度"><div class="progress-fill" id="progressFill"></div></div>
    <main class="layout">
      <section class="chronicle" aria-labelledby="eventTitle">
        <div class="section-heading"><h2>朝议 · 今日政务</h2><span id="eventIndex">诏令 01</span></div>
        <div class="event-kicker" id="eventEra">统一之初</div>
        <h2 class="event-title" id="eventTitle">帝号既立</h2>
        <p class="event-copy" id="eventCopy"></p>
        <div class="record" id="historyRecord"></div>
        <div class="choices" id="choices" aria-label="选择施政方略"></div>
        <div class="ending" id="ending" aria-live="polite"></div>
      </section>
      <aside class="side" aria-label="帝国状态">
        <div class="section-heading"><h2>大秦国势</h2><span>国势指标</span></div>
        <div class="stats-grid" id="stats"></div>
        <section class="log" aria-label="施政记录">
          <div class="section-heading"><h2>起居注</h2><span id="logCount">0 条</span></div>
          <ul class="log-list" id="logList"><li class="empty-log">尚无决策。<br>你的每一道诏令，都会留下回响。</li></ul>
        </section>
      </aside>
    </main>
    <section class="trend-panel" aria-labelledby="trendHeading">
      <div class="section-heading"><h2 id="trendHeading">列国与故地趋势</h2><span id="trendTurn">统一后的区域推演</span></div>
      <p class="trend-note">前221年统一后，韩、赵、魏、楚、燕、齐已不再是独立国家；此处追踪六国故地的民心与发展。匈奴为秦北方邻接势力，数值代表边境压力。趋势是基于施政选择的架空推演。</p>
      <div class="trend-grid" id="trends" aria-label="列国与地区发展趋势"></div>
    </section>
    <footer class="footer"><span>史实为骨，推演为戏。不同选择将通往不同结局。</span><span>咸阳 · 秦始皇二十六年</span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    "use strict";

    const initialState = {
      turn: 0,
      stats: { stability: 58, treasury: 62, people: 45, authority: 70, military: 56, infrastructure: 42, unity: 48, unrest: 32 },
      log: [],
      pendingIncident: null,
      regions: [
        { name: "秦廷", label: "核心发展", kind: "core", value: 72, bias: 0.2, color: "#c59c5b", history: [72] },
        { name: "韩地", label: "故地民心", kind: "former", value: 39, bias: -0.25, color: "#bd4932", history: [39] },
        { name: "赵地", label: "故地民心", kind: "former", value: 44, bias: -0.08, color: "#83a38d", history: [44] },
        { name: "魏地", label: "故地民心", kind: "former", value: 42, bias: -0.12, color: "#c99059", history: [42] },
        { name: "楚地", label: "故地民心", kind: "former", value: 38, bias: -0.2, color: "#94a95f", history: [38] },
        { name: "燕地", label: "故地民心", kind: "former", value: 41, bias: -0.1, color: "#6e9fa2", history: [41] },
        { name: "齐地", label: "故地民心", kind: "former", value: 48, bias: 0.05, color: "#c47e86", history: [48] },
        { name: "匈奴", label: "边境压力", kind: "border", value: 61, bias: 0.15, color: "#a887b5", history: [61] }
      ],
      ended: false
    };

    const statInfo = [
      { key: "stability", label: "天下安定", color: "#c59c5b" },
      { key: "treasury", label: "国库储备", color: "#83a38d" },
      { key: "people", label: "民生休养", color: "#bd4932" },
      { key: "authority", label: "皇权威望", color: "#c59c5b" },
      { key: "military", label: "边防军备", color: "#c99059" },
      { key: "infrastructure", label: "道路水利", color: "#6e9fa2" },
      { key: "unity", label: "天下归附", color: "#94a95f" },
      { key: "unrest", label: "民怨暗流", color: "#bd4932" }
    ];

    const events = [
      { year: 221, era: "统一之初", title: "帝号既立", text: "六国既灭，群臣议尊号。有人主张沿用王号以安天下，也有人认为新帝国需要一个前所未有的名号与秩序。你将如何昭示天下？", record: "公元前221年，秦王政完成统一，自称<strong>始皇帝</strong>，并推行一系列中央集权制度。", choices: [
        { title: "定皇帝之号", desc: "建立新朝仪，昭告天下一统。", effects: { authority: 9, stability: 3, treasury: -3 }, result: "皇帝之号传遍天下，百官称贺；新秩序也需要持续投入。" },
        { title: "先抚六国旧地", desc: "减轻新附之地负担，安其人心。", effects: { people: 9, stability: 5, treasury: -6 }, result: "旧地百姓稍得喘息，帝国初年的钱粮则更为紧张。" },
        { title: "严明法令", desc: "以秦法为准，迅速统一政令。", effects: { authority: 6, stability: 7, people: -5 }, result: "政令传达更快，地方对严法的畏惧也在增长。" }
      ]},
      { year: 220, era: "制度初成", title: "郡县与封建", text: "廷议如何治理广大的新帝国。有人请封宗室功臣为王，以镇守远方；也有人主张由朝廷直接任免地方官吏。", record: "秦统一后推行<strong>郡县制</strong>，地方长官由中央任免。", choices: [
        { title: "推行郡县", desc: "官吏由中央任免，政令直达郡县。", effects: { stability: 8, authority: 7, treasury: -4 }, result: "中央得以掌握地方官吏任免，治理网络逐步铺开。" },
        { title: "分封宗室", desc: "以宗亲镇守要地，减少朝廷远控。", effects: { stability: -5, authority: -4, treasury: 3 }, result: "短期治理负担减轻，地方势力却开始拥有自己的根基。" },
        { title: "郡县为主，留观察期", desc: "先派官治理要地，再按成效调整。", effects: { stability: 4, people: 3, treasury: -2 }, result: "制度推进较缓，却给新附之地留下了适应的时间。" }
      ]},
      { year: 219, era: "车同轨", title: "驰道与民力", text: "关中与东方之间道路不一，军情、粮运和商旅都受阻。修筑驰道可以让命令与物资更快抵达，但征发徭役会让百姓离开田亩。", record: "秦修筑以咸阳为中心的<strong>驰道</strong>，便利交通与政令传递。", choices: [
        { title: "大修驰道", desc: "集中民力修路，尽快连通帝国。", effects: { stability: 7, treasury: -7, people: -7 }, result: "道路渐通，调兵运粮更快；许多家庭却少了劳作的人手。" },
        { title: "分段缓修", desc: "优先修补粮道，控制征发规模。", effects: { stability: 4, treasury: -3, people: -2 }, result: "交通逐步改善，工程没有压垮沿途的农时。" },
        { title: "暂缓工程", desc: "将民力留给耕作，等待国库宽裕。", effects: { people: 5, treasury: 3, stability: -4 }, result: "百姓得以安心耕作，但边地与郡县仍觉朝廷遥远。" }
      ]},
      { year: 218, era: "书同文", title: "文字归一", text: "旧六国文书各有差异，官府文书往来常生误解。丞相建议颁行统一书体，博士们担忧地方典籍与习惯会被一扫而空。", record: "秦以<strong>小篆</strong>统一官方文字，推动政令与文书标准化。", choices: [
        { title: "颁行小篆", desc: "统一官方文书与刻石文字。", effects: { authority: 7, stability: 6, treasury: -2 }, result: "文书格式渐趋一致，吏员需要一段时间熟悉新字。" },
        { title: "官文统一，民间兼容", desc: "官府用小篆，民间书写暂从旧俗。", effects: { stability: 3, people: 4, authority: 2 }, result: "政务沟通更清晰，地方书写习惯也得以保留。" },
        { title: "留各地旧文", desc: "允许地方暂用旧字，减少制度冲击。", effects: { people: 3, stability: -4, authority: -3 }, result: "地方士民较易接受，但中央文书仍难以完全互通。" }
      ]},
      { year: 217, era: "衡量天下", title: "度量衡制", text: "各地尺、斗、斤两不一，税赋和交易难以核算。统一标准有利于治理，却也会打破旧有交易习惯。", record: "秦统一<strong>度量衡</strong>，使征收、工程与交易有了共同标准。", choices: [
        { title: "颁标准器", desc: "郡县依新制校验秤、斗与尺。", effects: { stability: 6, treasury: 5, authority: 4 }, result: "征收与交易更容易核对，官府账目也逐渐清晰。" },
        { title: "新旧并行一年", desc: "设过渡期，逐步更换器具。", effects: { people: 4, stability: 2, treasury: -2 }, result: "变法较为平缓，国库短期内要承担校制成本。" },
        { title: "严查私秤", desc: "重罚不合标准者，迅速肃清乱象。", effects: { treasury: 8, authority: 5, people: -7 }, result: "赋税核算增长迅速，民间对官府的畏惧随之加深。" }
      ]},
      { year: 216, era: "钱行天下", title: "半两钱", text: "统一后的市场仍流通各国旧币，商旅换算困难。统一货币能打通贸易，但强行收缴旧币也可能扰乱民间生计。", record: "秦推行以<strong>半两钱</strong>为代表的统一货币制度。", choices: [
        { title: "统一发行半两钱", desc: "以新币规范跨郡交易与赋税。", effects: { treasury: 7, stability: 5, people: -3 }, result: "跨地交易更加方便，旧币退出也带来了短暂的不便。" },
        { title: "限期兑换旧币", desc: "给商民时间换币，逐步收拢旧制。", effects: { people: 4, treasury: 3, stability: 2 }, result: "换币过程较为平稳，钱制统一稍慢一步。" },

          return {

            regions: Array.isArray(saved.regions) ? saved.regions : structuredClone(initialState.regions),

        console.warn("无法读取本地存档。", error);

    function renderStats() {

    function renderTrends() {
      const trendsElement = document.getElementById("trends");
      trendsElement.innerHTML = state.regions.map((region) => {
        const values = region.history.slice(-12);
        const width = 140;
        const height = 28;
        const low = Math.min(...values);
        const high = Math.max(...values);
        const spread = Math.max(high - low, 4);
        const points = values.map((value, index) => {
          const x = values.length === 1 ? width : index / (values.length - 1) * width;
          const y = height - 3 - (value - low + spread * 0.08) / (spread * 1.16) * (height - 6);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");
        const previous = values.length > 1 ? values[values.length - 2] : region.value;
        const delta = region.value - previous;
        const direction = delta > 0.2 ? "up" : delta < -0.2 ? "down" : "flat";
        const arrow = direction === "up" ? "↑" : direction === "down" ? "↓" : "·";
        return `<div class="trend-item"><div class="trend-name"><strong>${region.name}</strong><span>${region.label}</span></div><span class="trend-score">${Math.round(region.value)}<small class="trend-change ${direction}">${arrow}</small></span><svg class="trend-spark" viewBox="0 0 ${width} ${height}" role="img" aria-label="${region.name}趋势"><polyline points="${points}" stroke="${region.color}"></polyline></svg></div>`;
      }).join("");
      document.getElementById("trendTurn").textContent = `已推演 ${state.turn} / ${events.length} 年`;
    }

    function advanceTrends() {
      const { stability, treasury, people, authority, infrastructure, unity, military, unrest } = state.stats;
      for (const region of state.regions) {
        let change;
        if (region.kind === "border") {
          change = (55 - military) * 0.045 + (unrest - 35) * 0.018 + region.bias + (Math.random() - 0.5) * 0.7;
        } else if (region.kind === "core") {
          change = (treasury - 50) * 0.018 + (infrastructure - 45) * 0.022 + (stability - 50) * 0.012 + region.bias + (Math.random() - 0.5) * 0.6;
        } else {
          change = (people - 50) * 0.022 + (unity - 45) * 0.028 + (infrastructure - 45) * 0.012 - Math.max(0, authority - 75) * 0.018 - unrest * 0.012 + region.bias + (Math.random() - 0.5) * 0.7;
        }
        region.value = Math.max(0, Math.min(100, Math.round((region.value + change) * 10) / 10));
        region.history.push(region.value);
      }
    }

        button.innerHTML = `<span class="choice-no">${String(index + 1).padStart(2, "0")}</span><span class="choice-title">${choice.title}</span><span class="choice-desc">${choice.desc}</span>`;
        button.addEventListener("click", () => incident ? resolveIncident(choice) : makeChoice(choice));
        choicesElement.append(button);
      });
      saveState();
    }

    function makeChoice(choice) {
      if (state.ended) return;
      const event = events[state.turn];
      applyEffects(choice.effects);
      state.log.push({ year: event.year, title: event.title, choice: choice.title, result: choice.result });
      state.turn += 1;
      state.pendingIncident = incidents.find((incident) => incident.year === event.year) || null;
      if (!state.pendingIncident) advanceTrends();
      showToast(choice.result);
      render();
    }

    function resolveIncident(choice) {
      const incident = state.pendingIncident;
      if (!incident) return;
      applyEffects(choice.effects);
      state.log.push({ year: incident.year, title: incident.title, choice: choice.title, result: choice.result });
      state.pendingIncident = null;
      advanceTrends();
      showToast(choice.result);
      render();
    }

    function applyEffects(effects) {
      for (const [key, delta] of Object.entries(effects)) {
        if (key in state.stats) state.stats[key] = Math.max(0, Math.min(100, state.stats[key] + delta));
      }
      const round = (value) => Math.round(value * 10) / 10;
      state.stats.military = Math.max(0, Math.min(100, round(state.stats.military + (effects.stability || 0) * 0.2 + (effects.authority || 0) * 0.08)));
      state.stats.infrastructure = Math.max(0, Math.min(100, round(state.stats.infrastructure + (effects.stability || 0) * 0.1 + (effects.treasury || 0) * 0.08)));
      state.stats.unity = Math.max(0, Math.min(100, round(state.stats.unity + (effects.people || 0) * 0.22 + (effects.stability || 0) * 0.12 - (effects.authority || 0) * 0.08)));
      state.stats.unrest = Math.max(0, Math.min(100, round(state.stats.unrest - (effects.people || 0) * 0.2 - (effects.stability || 0) * 0.08 + (effects.authority || 0) * 0.12)));
    }

    function showEnding() {
      const ending = document.getElementById("ending");
      const average = Object.values(state.stats).reduce((sum, value) => sum + value, 0) / 4;
      let title = "帝国初定，余绪未绝";
      let text = "十二道诏令已落定。秦的制度与道路为后世留下深远影响，而急速扩张与严苛治理所积累的矛盾，也在始皇帝身后迅速浮现。";
      if (state.stats.people >= 65 && state.stats.stability >= 60) {
        title = "休养生息，天下渐安";
        text = "你在统一与安民之间找到了一条艰难的路。郡县、文字与制度继续运行，百姓也得到喘息。后世仍将讨论：若宽缓能再早一些，帝国的命运是否会不同？";
      } else if (state.stats.authority >= 75 && state.stats.stability >= 55) {
        title = "法令如一，威加海内";
        text = "帝国政令通行，中央威权深入郡县。只是天下归一不等于人心归一，严密的秩序需要不断的力量维系。";
      } else if (state.stats.people < 30 || state.stats.stability < 30) {
        title = "徭役渐重，暗流已生";
        text = "统一工程与严法消耗了太多民力，边地与旧国之人仍未安定。制度建立得很快，信任却来得很慢。始皇帝身后，潜伏的裂痕将一一显露。";
      } else if (state.stats.unrest >= 60) {
        title = "威令虽行，怨气渐积";
        text = "帝国制度已经铺开，但多地的民怨与不安仍在增长。朝廷需要在维持秩序与修复人心之间重新权衡。";
      }
      ending.innerHTML = `<h3>${title}</h3><p>${text}</p><p>最终国势：安定 ${Math.round(state.stats.stability)} · 国库 ${Math.round(state.stats.treasury)} · 民生 ${Math.round(state.stats.people)} · 威望 ${Math.round(state.stats.authority)} · 军备 ${Math.round(state.stats.military)} · 基建 ${Math.round(state.stats.infrastructure)} · 归附 ${Math.round(state.stats.unity)} · 民怨 ${Math.round(state.stats.unrest)}</p><button class="restart" type="button" id="endingRestart">重新推演</button>`;
      ending.style.display = "block";
      document.getElementById("endingRestart").addEventListener("click", resetGame);
    }

    function resetGame() {
      state = structuredClone(initialState);
      saveState();
      render();
      showToast("新的推演开始了");
    }

    document.getElementById("resetButton").addEventListener("click", () => {
      if (window.confirm("要结束当前推演并从前221年重新开始吗？")) resetGame();
    });

    render();
  </script>
</body>
</html>
